# Units: metres, seconds.
sim:
  dt: 0.05
  seed: 42
  steps: 3000

world:
  width: 200.0
  height: 120.0
  boundary_margin: 12.0

drones:
  count: 30
  radius: 0.5
  max_speed: 8.0
  cruise_speed: 5.0
  max_accel: 6.0
  perception_radius: 15.0
  separation_radius: 4.0
  spawn_spacing: 3.0
  spawn_speed: 0.5

boids:
  separation_weight: 2.5
  alignment_weight: 1.0
  cohesion_weight: 0.8
  boundary_weight: 3.0
  goal_weight: 1.2

sensor:
  num_rays: 36            # lidar beams over 360 degrees
  range: 20.0

avoidance:
  method: orca            # none | apf | orca | hybrid  (orca: best in benchmark)
  apf_weight: 1.5
  apf_influence: 8.0
  orca_time_horizon: 2.0
  orca_obstacle_horizon: 1.5
  orca_neighbor_dist: 15.0
  orca_max_neighbors: 10
  safety_margin: 0.3

scenario:
  name: open              # open | forest | corridor | random
  goal_radius: 15.0
  num_obstacles: 25       # random scenario only

render:
  window_width: 1200
  window_height: 760
  fps: 60
  trail_length: 40
  steps_per_frame: 1
