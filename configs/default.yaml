# Units: metres, seconds.
sim:
  dt: 0.05
  seed: 42
  steps: 3000

world:
  width: 200.0
  height: 120.0
  boundary_margin: 12.0

drones:
  count: 30
  radius: 0.5
  max_speed: 8.0
  cruise_speed: 5.0
  max_accel: 6.0
  perception_radius: 15.0
  separation_radius: 4.0
  spawn_spacing: 3.0
  spawn_speed: 0.5

boids:
  separation_weight: 2.5
  alignment_weight: 1.0
  cohesion_weight: 0.8
  boundary_weight: 3.0
  goal_weight: 1.2

sensor:
  num_rays: 36            # lidar beams over 360 degrees
  range: 20.0

avoidance:
  method: orca            # none | apf | orca | hybrid  (orca: best in benchmark)
  apf_weight: 1.5
  apf_influence: 8.0
  orca_time_horizon: 2.0
  orca_obstacle_horizon: 1.5
  orca_neighbor_dist: 15.0
  orca_max_neighbors: 10
  safety_margin: 0.3

scenario:
  name: open              # open | forest | corridor | random | survey | maze
  goal_radius: 15.0
  num_obstacles: 25       # random scenario only

mapping:
  enabled: true
  cell_size: 2.0          # occupancy-grid cell (m)
  update_interval: 0.1    # s between lidar -> map updates
  l_free: -0.4
  l_occ: 0.85
  l_max: 4.0
  known_threshold: 1.0

comms:
  enabled: true
  range: 30.0             # radio range (m)
  packet_loss: 0.0        # 0..1
  latency: 0.1            # s
  broadcast_interval: 0.25  # s (4 Hz)
  share_maps: true
  relay: true             # multi-hop forwarding
  max_cells_per_message: 300

planning:
  enabled: false          # true: each drone plans routes on its own map
  algorithm: field        # field (backward Dijkstra, fast) | astar
  replan_interval: 1.0    # min s between replans when the map changed
  refresh_interval: 5.0   # full replan at least this often
  unknown_cost: 0.3       # unknown cells cost a bit more (optimistic planning)
  inflation_cost: 8.0
  clearance_cost: 2.0
  clearance_cells: 2.0
  lookahead: 12.0         # m along the path for the steering target

formation:
  enabled: false          # true: leader-follower formation flying
  shape: v                # line | v | circle | box | column
  spacing: 5.0            # m between neighbouring slots
  speed: 3.5              # leader speed (followers need spare speed to catch up)
  gain: 0.8               # slot-tracking gain (1/s)
  adaptive: true          # collapse to a column for narrow passages, restore after
  squeeze_lookahead: 18.0 # m of the leader's route checked for passage width
  squeeze_margin: 2.0     # m of extra width needed on each side
  restore_delay: 2.0      # s the passage must stay wide before restoring the shape
  leader_timeout: 3.0     # s: leader info older than this is ignored
  heading_tau: 1.5        # s: smoothing of the formation heading
  slowdown_error: 4.0     # m: leader slows when followers are this far off-slot

render:
  window_width: 1200
  window_height: 760
  fps: 60
  trail_length: 40
  steps_per_frame: 1
